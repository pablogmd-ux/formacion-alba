<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EEF5FA; --surface:#FFFFFF; --ink:#16324F; --muted:#5B6F84; --line:#D3E0EB;
  --was:#E9A800; --was-soft:#FFF4D1; --were:#1C74C9; --were-soft:#DDEEFF;
  --ok:#1E9E62; --ok-soft:#DDF5E8; --bad:#D6453D; --bad-soft:#FDE3E1; --chip:#E3EDF5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D2B; --surface:#172A3D; --ink:#E7F0F8; --muted:#9DB2C6; --line:#2A4158;
    --was:#FFC83D; --was-soft:#3A3113; --were:#6BB3FF; --were-soft:#15314F;
    --ok:#4FD08F; --ok-soft:#153828; --bad:#FF7B72; --bad-soft:#3E1B1A; --chip:#20364C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D2B; --surface:#172A3D; --ink:#E7F0F8; --muted:#9DB2C6; --line:#2A4158;
  --was:#FFC83D; --was-soft:#3A3113; --were:#6BB3FF; --were-soft:#15314F;
  --ok:#4FD08F; --ok-soft:#153828; --bad:#FF7B72; --bad-soft:#3E1B1A; --chip:#20364C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header{padding:12px 0 4px}
.big{font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;font-weight:700;font-size:clamp(40px,9vw,70px);line-height:1;margin:0;letter-spacing:-1px}
.big .a{color:var(--was)} .big .b{color:var(--were)} .big .s{color:var(--muted);font-weight:500}
.sub{color:var(--muted);margin:10px 0 0;font-weight:600}
h2{font-family:Fredoka,Arial,sans-serif;font-weight:600;font-size:26px;margin:0 0 6px}
.was{color:var(--was);font-weight:800} .were{color:var(--were);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}
details.rules summary{cursor:pointer;font-family:Fredoka,Arial,sans-serif;font-size:22px;font-weight:600;list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:" (tap to hide)";font-family:Nunito,Arial,sans-serif;font-size:15px;color:var(--muted);font-weight:600}
details.rules:not([open]) summary::after{content:" (tap to show)"}
.rule{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rn{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:15px}
.rule p{margin:2px 0}
.ex{color:var(--muted)}
.modebar{display:flex;gap:8px;margin:0 0 14px}
.modebar button{border:2px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:7px 16px;font:800 14px Nunito,Arial,sans-serif;cursor:pointer}
.modebar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.subsec{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:14px 0}
details.subsec>summary{padding:16px 20px;font:800 17px Fredoka,Nunito,Arial,sans-serif;color:var(--ink);
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;border-radius:18px}
details.subsec>summary::-webkit-details-marker{display:none}
details.subsec>summary::after{content:"";margin-left:auto;width:11px;height:11px;flex:0 0 auto;
  border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details.subsec[open]>summary::after{transform:rotate(-135deg) translate(-3px,-3px)}
details.subsec>summary .tick{color:var(--ok);font-weight:800}
.card.inner{background:transparent;border:0;border-radius:0;margin:0;padding:0 20px 20px}
.card.inner>h2{display:none}
.card.inner>.hint:first-of-type{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:2px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 13px;font:700 15px Nunito,Arial,sans-serif;cursor:pointer}
.chips button:disabled{opacity:.3}
.built{min-height:44px;border:2px dashed var(--line);border-radius:12px;padding:9px 12px;
  margin:4px 0 2px;font-weight:700;color:var(--ink)}
.built.right{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.built.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.built .ph{color:var(--muted);font-weight:500;font-style:italic}
.svopt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.svopt span{background:var(--chip);border-radius:9px;padding:5px 10px;font-weight:800;font-size:14px}
.svopt span i{display:block;font-weight:600;font-size:12px;color:var(--muted);font-style:normal}
.mapwrap{overflow-x:auto;margin:0 0 18px;-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block;min-width:600px;width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mapwrap .road{fill:var(--chip)}
.mapwrap .rname{fill:var(--muted);font:600 13px Nunito,Arial,sans-serif}
.mapwrap .plot{fill:var(--were-soft);stroke:var(--line)}
.mapwrap .pname{fill:var(--ink);font:700 14px Nunito,Arial,sans-serif;text-anchor:middle}
.mapwrap .start{fill:var(--was-soft);stroke:var(--was);stroke-width:2}
.mapwrap .sname{fill:var(--was);font:800 14px Nunito,Arial,sans-serif;text-anchor:middle}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.box{border-radius:14px;padding:14px}
.box.w1{background:var(--was-soft)} .box.w2{background:var(--were-soft)}

.box.w1 b{color:var(--was)} .box.w2 b{color:var(--were)}
.groups{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:10px -16px 0;padding-left:16px;padding-right:16px}

nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;display:flex;gap:8px;overflow-x:auto}
nav button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 15px Nunito,Arial,sans-serif;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button .done{color:var(--ok)}

.hint{color:var(--muted);margin:0 0 14px;font-style:italic}
.item{padding:12px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:0}
.q{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 16px;font:700 17px Nunito,Arial,sans-serif;cursor:pointer;min-width:70px}
.opt:hover{border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.sel{border-color:var(--ink);background:var(--chip)}
.locked{background:var(--chip);border-radius:14px;padding:18px;text-align:center}
.qnum{display:inline-block;width:26px;font-weight:800;color:var(--muted)}
.tagline{color:var(--muted);font-size:14.5px;font-weight:700;margin:0 0 6px}
.item .q{margin-left:26px}
.res{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:center;font-size:15px}
.pill{border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}

.opt:disabled{cursor:default}

.bank span{background:var(--surface);border-radius:8px;padding:4px 10px;font-weight:700;font-size:15px}
input[type=text]{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:600 17px Nunito,Arial,sans-serif}
textarea{width:100%;min-height:200px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:400 17px Nunito,Arial,sans-serif;line-height:1.7;resize:vertical}
input.gap{width:130px;display:inline-block;padding:4px 8px;margin:2px}
input.short{width:160px;display:inline-block}
input.right{border-color:var(--ok);background:var(--ok-soft)}
input.wrong{border-color:var(--bad);background:var(--bad-soft)}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--were);outline-offset:2px}
.fb{font-size:15px;font-weight:700;margin-top:4px;min-height:1px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr;gap:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font:800 17px Nunito,Arial,sans-serif;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.score{font-weight:800;font-size:18px}
table.forms{width:100%;border-collapse:collapse}
.tscroll{overflow-x:auto}
table.forms th,table.forms td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
table.forms th{font-size:14px;color:var(--muted)}
table.forms td:first-child{font-weight:800;white-space:nowrap}
table.forms input{min-width:110px}
.postcard{background:var(--was-soft);border-radius:16px;padding:18px;line-height:2.2}
.result{text-align:center;padding:20px 0}
.result .n{font-family:Fredoka,Arial,sans-serif;font-size:64px;font-weight:700;line-height:1}
.chip{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 10px;font-weight:700;font-size:15px;margin:2px 4px 2px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 auto;margin-top:3px;accent-color:var(--ok)}
.model{background:var(--were-soft);border-radius:14px;padding:16px;margin-top:10px}
.model p{margin:0 0 10px}
@media (max-width:560px){.split{grid-template-columns:1fr} body{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:transform .1s}.opt:active,.btn:active{transform:scale(.96)}}
</style>
</head>

<div class="wrap">

<script>
// ---------- helpers ----------
function normalize(s){
  return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[‘’‛`´′]/g,"'")
    .toLowerCase()
    .replace(/n't\b/g," not")
    .replace(/[.,!?;:"“”]/g," ")
    .replace(/\s+/g," ").trim();
}
const same=(a,b)=>normalize(a)===normalize(b);
const raw=s=>(s||"").replace(/[‘’‛`´]/g,"'").trim().toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const el=(tag,attrs={},html="")=>{const e=document.createElement(tag);for(const k in attrs){k==="class"?e.className=attrs[k]:e.setAttribute(k,attrs[k])}if(html)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const strip=h=>String(h).replace(/<[^>]*>/g,"").replace(/\s*→\s*$/,"").replace(/\s+/g," ").trim();

// ---------- data: vocabulary ----------
const VOCAB_WELCOME=[
 ["up","hinauf"],["lovely","schön"],["over","über"],["custard","die Vanillasoße"],["dessert","der Nachtisch"],

 ["cool","kühl"],["degree","der Grad"],["million","die Million"],["seaside","die Meeresküste"],
 ["be busy","beschäftigt sein"],["too","zu"],["all summer","den ganzen Sommer"],["surprised","überrascht"],
 ["classical","klassisch"],["ticket","die Eintrittskarte"],["free","kostenlos"],["pride","der Stolz"],["parade","die Parade"],
 ["jealous (of)","neidisch (auf), eifersüchtig (auf)"],["swap","tauschen"],["thick","dick"],["nothing","(gar) nichts"],
 ["past","die Vergangenheit"],["view","die Aussicht"],["what else","was sonst"],["middle","die Mitte"],
 ["expensive","teuer"],["instead","stattdessen"],["cry","weinen"],["sell","verkaufen"],["wet","nass"],["dry","trocken"]
];
const VOCAB_UNIT1=[
 // Unit 1: Holiday stories
 ["hike","wandern"],["experience","das Erlebnis"],["summary","die Zusammenfassung"],["tourist","der Tourist, die Touristin"],
 // Part A
 ["the last lesson","die letzte Stunde"],["enjoy","genießen"],["stay (at/with)","übernachten (in/bei), vorübergehend wohnen"],
 ["ride a bike","Rad fahren"],["pretty","hübsch"],["ghost","der Geist, das Gespenst"],["train","der Zug"],
 ["get in(to) a car","in ein Auto einsteigen"],["get on(to) a bus","in einen Bus einsteigen"],["get off a bus","aus einem Bus aussteigen"],
 ["get out of a car","aus einem Auto aussteigen"],
 ["wave","winken"],["drive","mit dem Auto fahren"],["drive off","wegfahren"],["when","als"],
 ["onto sth.","auf etwas (hinauf)"],["off sth.","von etwas herunter"],["cartoon","der Comicstrip"],
 ["moped","das Moped"],["plane","das Flugzeug"],["scooter","der Roller, der Motorroller"],["tram","die Tram, die Straßenbahn"],
 ["go by bus / car","mit dem Bus / Auto fahren"],
 ["campsite","der Zeltplatz"],["caravan","der Wohnwagen"],["castle","die Burg, das Schloss"],
 ["cathedral","die Kathedrale, der Dom"],["forest","der Wald"],["holiday home","die Ferienwohnung"],
 ["island","die Insel"],["lake","der See"],["mountain","der Berg"],["museum","das Museum"],
 ["restaurant","das Restaurant"],["theme park","der Freizeitpark"],["village","das Dorf"],["zoo","der Zoo"],
 ["phonetic symbol","das Lautschriftsymbol"],["symbol","das Symbol"],["trip","der Ausflug, die Reise"],
 ["idiom","die Redensart"],["expression","der Ausdruck"],["at first","anfangs"],
 ["Dear …,","Liebe/r …,  Sehr geehrte(r) …,"],["Love, …","Liebe Grüße, …"],["Best wishes","Viele / Herzliche Grüße"],
 ["make notes (on sth.)","sich Notizen machen (über etwas)"],["informal","informell"],["formal","formell, förmlich"],
 ["start","der Anfang"],
 // Part B
 ["go on a tour","einen Rundgang / eine Rundfahrt machen"],["I didn't see them.","Ich sah sie nicht."],
 ["be afraid (of sth.)","Angst haben (vor etwas)"],["building","das Gebäude"],["mostly","hauptsächlich, meistens"],
 // Creepy places (3b)
 ["broken","kaputt"],["creepy","gruselig, unheimlich"],["dark","dunkel"],["dirty","schmutzig"],
 ["horrible","schrecklich"],["scary","gruselig"],["silent","still"],["stormy","stürmisch"],
 ["strange","seltsam"],["weird","komisch, seltsam"]
];
const VOCAB_NOV=[
 ["ruin","die Ruine"],["nobody","niemand"],["no one","niemand"],["reach","erreichen"],
 ["lead","führen, leiten"],["tunnel","der Tunnel"],["anybody?","(irgend)jemand?"],
 ["roof","das Dach"],["low","niedrig"],["bend down","sich hinunterbeugen, sich bücken"],
 ["as","als, während"],["drop","der Tropfen"],["fall","fallen, stürzen, hinfallen"],
 ["head","der Kopf"],["reply (to)","antworten (auf), erwidern"],["owl","die Eule"],
 ["wind","der Wind"],["flicker","flackern"],["work","funktionieren"]
];
const VOCAB_SETS=[["nov","Test noviembre",VOCAB_NOV],["unit1","Unit 1",VOCAB_UNIT1],["welcome","Welcome Back",VOCAB_WELCOME],
 ["all","Todo",VOCAB_NOV.concat(VOCAB_UNIT1,VOCAB_WELCOME)]];
let VOCAB=VOCAB_NOV;

// ---------- data: was / were ----------
const WW=[
 ["Noah ___ at the skate park on Saturday.","was"],["Alice and Lily ___ on the pier yesterday.","were"],
 ["I ___ really happy on my birthday.","was"],["The ice creams ___ very big.","were"],
 ["My brother ___ in the garden two hours ago.","was"],["You ___ very funny in the school play, Zane!","were"],
 ["The cats ___ hungry this morning.","were"],["It ___ windy at the beach last week.","was"],
 ["We ___ in the library after lunch.","were"],["Mr Lee ___ our teacher last year.","was"],
 ["Jake and his dad ___ in London last summer.","were"],["The film ___ really exciting.","was"],
 ["She ___ at the dentist on Monday.","was"],["You and Noah ___ late again!","were"],
 ["My grandparents ___ in Brighton in July.","were"],["The museum ___ closed yesterday.","was"],
 ["Where ___ you yesterday?","were"],["How ___ your weekend?","was"],
 ["Why ___ they late for school?","were"],["Who ___ at the door?","was"]
];
const NEG=[
 ["Zane was at the party.","Zane wasn't at the party."],["The children were tired.","The children weren't tired."],
 ["I was hungry at lunchtime.","I wasn't hungry at lunchtime."],["We were at the beach on Sunday.","We weren't at the beach on Sunday."],
 ["The pizza was hot.","The pizza wasn't hot."],["You were in class 5 last year.","You weren't in class 5 last year."],
 ["Lily and Alice were angry.","Lily and Alice weren't angry."],["It was sunny yesterday.","It wasn't sunny yesterday."],
 ["My phone was in my bag.","My phone wasn't in my bag."],["The windows were open.","The windows weren't open."]
];
const QS=[
 ["Noah / at home / last night?",true,"Was Noah at home last night?","Yes, he was."],
 ["Alice and Lily / at the cinema / on Friday?",false,"Were Alice and Lily at the cinema on Friday?","No, they weren't."],
 ["you / at school / yesterday?",true,"Were you at school yesterday?","Yes, I was."],
 ["the test / difficult?",false,"Was the test difficult?","No, it wasn't."],
 ["Mr Lee / in Brighton / last week?",true,"Was Mr Lee in Brighton last week?","Yes, he was."],
 ["the shops / open / on Sunday?",false,"Were the shops open on Sunday?","No, they weren't."],
 ["Mrs Bond / happy / with the class?",true,"Was Mrs Bond happy with the class?","Yes, she was."],
 ["your friends / at the beach?",true,"Were your friends at the beach?","Yes, they were."],
 ["it / hot / in Spain?",true,"Was it hot in Spain?","Yes, it was."],
 ["Jake / tired / after the match?",false,"Was Jake tired after the match?","No, he wasn't."]
];
const THERE_OPTS=["There was","There were","There wasn't","There weren't","Was there","Were there"];
const TH=[
 ["___ a big boat on the sea. (+)","There was"],["___ lots of people on the pier. (+)","There were"],
 ["___ any bread in the kitchen. (–)","There wasn't"],["___ any buses on Sunday. (–)","There weren't"],
 ["___ a swimming pool at the hotel? (?)","Was there"],["___ any good films on TV? (?)","Were there"],
 ["___ two new girls in our class. (+)","There were"],["___ lots of snow last winter. (+)","There was"],
 ["___ a teacher in the classroom. (–)","There wasn't"],["___ many children in the park. (–)","There weren't"],
 ["___ a lot of homework yesterday? (?)","Was there"],["___ three cakes on the table. (+)","There were"]
];
const MIS=[
 ["Lily were at the beach.","Lily was at the beach."],["We was in the park yesterday.","We were in the park yesterday."],
 ["He weren't at home.","He wasn't at home."],["Was they at school?","Were they at school?"],
 ["There were a dog in the garden.","There was a dog in the garden."],["Were Noah happy?","Was Noah happy?"],
 ["You was very funny!","You were very funny!"],["There was many people at the party.","There were many people at the party."],
 ["\"Were they at home?\" – \"Yes, they was.\"","Yes, they were."],["I weren't tired.","I wasn't tired."]
];
const CARD=["Dear Noah,","London {was} great! Dad and I {were} at the Science Museum on Monday. It {was} really interesting, but the café {wasn't} open, so we {were} very hungry!",
 "On Tuesday we {were} at a football match. There {were} thousands of fans. The weather {wasn't} very nice – it {was} cold and there {was} lots of rain.",
 "Where {were} you last week? {Was} your holiday fun?","See you on Monday,<br>Zane"];
const FORMS=[["I","was","was not","wasn't"],["you","were","were not","weren't"],["he / she / it","was","was not","wasn't"],
 ["we","were","were not","weren't"],["you","were","were not","weren't"],["they","were","were not","weren't"]];

// ---------- data: regular verbs ----------
// [base, past, rule]  rule: 1 = +ed, 2 = +d (ends in e), 3 = y -> ied, 4 = double consonant
const REG=[
 ["play","played",1],["visit","visited",1],["watch","watched",1],["listen","listened",1],["help","helped",1],
 ["clean","cleaned",1],["call","called",1],["start","started",1],["rain","rained",1],["walk","walked",1],
 ["want","wanted",1],["wash","washed",1],["work","worked",1],["open","opened",1],["ask","asked",1],

function makeTest(n,seed){
  const r=rng(seed||(7000+n*97));
  const core=IRR.filter(v=>CORE.includes(v[0]));
  const allVoc=VOCAB_UNIT1.concat(VOCAB_WELCOME)
    .filter(x=>!/[.…]/.test(x[0])&&!/[.…]/.test(x[1])&&x[0]!=="was"&&x[0]!=="were");
  const typable=allVoc.filter(x=>!/[,(/]/.test(x[0]));
  const qs=[];
  // errores de ortografía realistas, según la regla del verbo
  function fakesFor(b,pa,rule){
    if(rule===2)return [b+"ed",b.slice(0,-1)+"d",b.slice(0,-1)+"t"];           // dance → danceed / dancd / dancet
    if(rule===3)return [b+"ed",b.slice(0,-1)+"yd",b.slice(0,-1)+"iet"];        // hurry → hurryed / hurryd / hurriet
    if(rule===4)return [b+"ed",b+"d",b+"t"];                                   // stop → stoped / stopd / stopt
    return [b+"d",b+"t",b+b.slice(-1)+"ed"];                                   // look → lookd / lookt / lookked
  }
  // 1-2 verbos regulares
  sPick(REG,2,r).forEach(([b,pa])=>qs.push({tag:"Escribe el simple past",t:"type",q:b+"   →",a:[pa]}));
  // 3-4 verbos irregulares
  sPick(core,2,r).forEach(([b,pa,de])=>qs.push({tag:"Escribe el simple past (verbo irregular)",t:"type",
    q:b+"   ("+de+")   →",a:[pa]}));
  // 4b pasado → infinitivo
  {const [pa,inf,de]=sPick(PAST2INF,1,r)[0];
   qs.push({tag:"Escribe el infinitivo (la Grundform), como lo buscarías en el diccionario",t:"type",
     q:pa+"   ("+de+")   →",a:[inf,"to "+inf]})}
  // 4c can → could
  {const [q0,a]=sPick(COULD,1,r)[0];
   qs.push({tag:"Completa con could o couldn't",t:"mc",q:q0,a,opts:["could","couldn't"]})}
  // 5 ortografía del -ed
  {const [b,pa,rule]=sPick(REG,1,r)[0];
   const fk=fakesFor(b,pa,rule).filter(x=>x!==pa);
   qs.push({tag:"Elige la forma bien escrita",t:"mc",q:b+"   →",a:pa,opts:sShuf([pa,...fk.slice(0,3)],r)})}
  // 6 regular o irregular
  {const [b,pa]=sPick(core,1,r)[0];const fake=b.endsWith("e")?b+"d":b+"ed";
   const others=sPick(core.filter(v=>v[1]!==pa),2,r).map(v=>v[1]);
   qs.push({tag:"Cuidado: ¿-ed o irregular?",t:"mc",q:b+"   →",a:pa,opts:sShuf([pa,fake,...others],r)})}
  // 7 negativa
  {const [o,a]=sPick(NEG_PAST,1,r)[0];
   qs.push({tag:"Escribe la frase en NEGATIVA, con didn't",t:"type",q:o,a:[a]})}
  // 8 pregunta
  {const it=sPick(QS_PAST,1,r)[0];
   qs.push({tag:"Escribe la PREGUNTA en simple past, con did",t:"type",q:it[0],a:[it[2]]})}
  // 9 respuesta corta
  {const it=sPick(QS_PAST,1,r)[0];const corr=it[3];const wrongs=[];
   [["did","was"],["did","does"],["didn't","wasn't"],["didn't","doesn't"],["did","is"],["didn't","isn't"]]
     .forEach(([x,y])=>{if(corr.includes(x)){const w=corr.replace(x,y);if(w!==corr&&!wrongs.includes(w))wrongs.push(w)}});
   qs.push({tag:"Elige la respuesta corta correcta",t:"mc",q:it[2],a:corr,opts:sShuf([corr,...wrongs.slice(0,3)],r)})}
  // 10 was / were  o  there was / there were
  {if(r()<0.5){
     const [q0,a]=sPick(TH,1,r)[0];
     const kind=q0.includes("(+)")?"afirmativa":q0.includes("(–)")?"negativa":"pregunta";
     qs.push({tag:`Completa con there was / there were — frase ${kind}`,t:"mc",
       q:q0.replace(/\s*\((\+|–|\?)\)\s*$/,""),a,opts:sShuf(THERE_OPTS,r)});
   }else{
     const [q0,a]=sPick(WW,1,r)[0];
     qs.push({tag:"Completa con was o were",t:"mc",q:q0,a,opts:["was","were"]});
   }}
  // 11 presente o pasado
  {const [q0,a,cue]=sPick(DODID,1,r)[0];const caps=/^[A-Z]/.test(a);
   qs.push({tag:`¿Presente o pasado? Completa con do / does / did / don't / doesn't / didn't — ${cue}`,
     t:"mc",q:q0,a,opts:sShuf(DO_OPTS.map(o=>caps?o[0].toUpperCase()+o.slice(1):o),r)})}
  // 12 frase afirmativa
  {const [q0,a,base]=sPick(POS,1,r)[0];const fake=base.endsWith("e")?base+"d":base+"ed";
   const others=sPick(POS.filter(x=>x[1]!==a&&x[1]!==fake),3,r).map(x=>x[1]);
   const opts=[...new Set([a,...(fake!==a?[fake]:[]),...others])].slice(0,4);
   qs.push({tag:"Completa la frase con el simple past",t:"mc",q:q0,a,opts:sShuf(opts,r)})}
  // 13 vocabulario inglés → alemán
  {const w=sPick(allVoc,1,r)[0];const wrong=sPick(allVoc.filter(x=>x[1]!==w[1]),3,r).map(x=>x[1]);
   qs.push({tag:"Traduce al alemán",t:"mc",q:w[0],a:w[1],opts:sShuf([w[1],...wrong],r)})}
  // 14 vocabulario alemán → inglés (con la inicial, para que no haya dudas)
  {const w=sPick(typable,1,r)[0];const ini=w[0][0];
   qs.push({tag:"Traduce al inglés",t:"type",q:w[1]+"   →   "+ini+"…",
     a:[w[0],"to "+w[0],"the "+w[0],"a "+w[0]]})}
  // 15 nota → frase completa
  {const [note,answers]=sPick(NOTES2SENT,1,r)[0];
   const alts=answers.slice();
   answers.forEach(a=>{if(/^I /.test(a))alts.push(a.replace(/^I /,"We "))});
   const first=answers[0].split(" ")[0];
   qs.push({tag:`Convierte la nota en una frase completa en simple past (empieza por "${first}…")`,
     t:"type",q:note,a:alts})}
  return {id:"m"+n,title:"Test "+n,qs,listen:null,
    intro:"17 preguntas de todo: verbos, frases, vocabulario y una de redacción. Cada pregunta dice en gris lo que hay que hacer."};
}

// ---------- generic builders ----------
const done={};
let group="vocab", current="";

function scoreLine(card,got,total,id){
  const s=card.querySelector(".score");s.textContent=`${got} / ${total}`+(got===total?"  – perfect!":"");
  if(got===total){done[id]=true;renderNav()}
}
function footer(card,onCheck,id){
  const a=el("div",{class:"actions"});
  const c=el("button",{class:"btn",type:"button"},"Corregir");c.onclick=onCheck;
  const n=el("button",{class:"btn ghost",type:"button"},"Otras frases");n.onclick=()=>render();
  a.append(c,n,el("span",{class:"score"}));card.appendChild(a);
}
function buildChoice(title,hint,items,id){
  const card=el("section",{class:"card"});card.append(el("h2",{},title),el("p",{class:"hint"},hint));
  let got=0,answered=0;
  items.forEach(it=>{
    const row=el("div",{class:"item"});row.appendChild(el("p",{class:"q"},esc(it.q).replace("___","<b>______</b>")));
    const opts=el("div",{class:"opts"});const fb=el("div",{class:"fb"});
    it.opts.forEach(o=>{
      const b=el("button",{class:"opt",type:"button"},esc(o));
      b.onclick=()=>{
        answered++;
        opts.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add("right")});
        if(o===it.a){got++;fb.className="fb ok";fb.textContent="Correct!"}
        else{b.classList.add("wrong");fb.className="fb no";fb.textContent=`Answer: ${it.q.replace("___",it.a).replace(/ \((\+|–|\?)\)$/,"")}`}
        card.querySelector(".score").textContent=`${got} / ${items.length}`;
        if(answered===items.length&&got===items.length){done[id]=true;renderNav();card.querySelector(".score").textContent+="  – perfect!"}
      };
      opts.appendChild(b);
    });
    row.append(opts,fb);card.appendChild(row);
  });
  const a=el("div",{class:"actions"});const n=el("button",{class:"btn ghost",type:"button"},"Otras frases");n.onclick=()=>render();
  a.append(n,el("span",{class:"score"},`0 / ${items.length}`));card.appendChild(a);
  return card;
}
function buildType(title,hint,items,id,bank){
  const card=el("section",{class:"card"});card.append(el("h2",{},title),el("p",{class:"hint"},hint));
  if(bank){const b=el("div",{class:"bank"});bank.forEach(w=>b.appendChild(el("span",{},esc(w))));card.appendChild(b)}
  const rows=items.map(it=>{
    const row=el("div",{class:"item"});row.appendChild(el("p",{class:"q"},esc(it.q)));
    const inp=el("input",{type:"text",autocomplete:"off",autocapitalize:"sentences",spellcheck:"false"});
    const fb=el("div",{class:"fb"});row.append(inp,fb);card.appendChild(row);return {it,inp,fb};
  });
  footer(card,()=>{
    let got=0;rows.forEach(({it,inp,fb})=>{
      const ok=it.a.some(x=>same(inp.value,x));inp.className=ok?"right":"wrong";
      fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Correct!":"Answer: "+it.a[0];if(ok)got++;
    });scoreLine(card,got,rows.length,id);
  },id);
  return card;
}
// gap text: parts like "text {answer} text" or "{answer|prompt}"
function buildGapText(title,hint,paragraphs,id,opts={}){
  const card=el("section",{class:"card"});card.append(el("h2",{},title),el("p",{class:"hint"},hint));
  if(opts.bank){const b=el("div",{class:"bank"});opts.bank.forEach(w=>b.appendChild(el("span",{},esc(w))));card.appendChild(b)}
  const box=el("div",{class:opts.plain?"":"postcard"});const gaps=[];let n=0;
  paragraphs.forEach(par=>{
    const lines=Array.isArray(par)?par:[par];
    const p=el("p",{style:"margin:0 0 10px"});
    p.innerHTML=lines.map(line=>line.replace(/\{([^}]+)\}/g,(m,inner)=>{
      const [ans,prompt]=inner.split("|");n++;gaps.push(ans);
      const hintTxt=prompt?` <span class="ex">(${esc(prompt.replace("be-sg","be").replace("be-pl","be"))})</span>`:"";
      return `<input type="text" class="gap" data-i="${n-1}" autocomplete="off" autocapitalize="off" spellcheck="false">${hintTxt}`;
    })).join("<br>");
    box.appendChild(p);
  });
  card.appendChild(box);
  const a=el("div",{class:"actions"});const c=el("button",{class:"btn",type:"button"},"Corregir");
  const cl=el("button",{class:"btn ghost",type:"button"},"Borrar");cl.onclick=()=>render();
  const fb=el("div",{class:"fb"});
  c.onclick=()=>{let got=0;const wrong=[];box.querySelectorAll("input").forEach(i=>{
      const k=+i.dataset.i;const ok=raw(i.value).replace(/\s+/g," ")===gaps[k].toLowerCase();
      i.className="gap "+(ok?"right":"wrong");if(ok)got++;else wrong.push(`(${k+1}) ${gaps[k]}`)});
    fb.className="fb "+(wrong.length?"no":"ok");fb.textContent=wrong.length?"Answers: "+wrong.join("  ·  "):"All correct!";
    scoreLine(card,got,gaps.length,id)};
  a.append(c,cl,el("span",{class:"score"}));card.append(a,fb);
  return card;
}
function buildQuestionPairs(title,hint,rowsData,id){
  const card=el("section",{class:"card"});card.append(el("h2",{},title),el("p",{class:"hint"},hint));
  const rows=rowsData.map(([p,yes,q,a])=>{
    const row=el("div",{class:"item"});row.appendChild(el("p",{class:"q"},`<b>${esc(p)}</b> &nbsp;${yes?"✓":"✗"}`));
    const box=el("div",{class:"row2"});
    const i1=el("input",{type:"text",placeholder:"Question",autocomplete:"off",spellcheck:"false"});
    const i2=el("input",{type:"text",placeholder:"Short answer",autocomplete:"off",spellcheck:"false"});
    const fb=el("div",{class:"fb"});box.append(i1,i2);row.append(box,fb);card.appendChild(row);return {q,a,i1,i2,fb};
  });
  footer(card,()=>{
    let got=0;rows.forEach(r=>{
      const alt=r.a.replace("I did","we did").replace("I didn't","we didn't").replace("I was","we were").replace("I wasn't","we weren't");
      const ok1=same(r.i1.value,r.q),ok2=same(r.i2.value,r.a)||same(r.i2.value,alt);
      r.i1.className=ok1?"right":"wrong";r.i2.className=ok2?"right":"wrong";got+=(ok1?1:0)+(ok2?1:0);
      r.fb.className="fb "+(ok1&&ok2?"ok":"no");r.fb.textContent=ok1&&ok2?"Correct!":`Answer: ${r.q}  ${r.a}`;
    });scoreLine(card,got,rows.length*2,id);
  },id);
  return card;
}

    setBar.appendChild(b);
  });

  card.appendChild(setBar);
  const modes=el("div",{class:"opts",style:"margin-bottom:10px"});
  const dirBar=el("div",{class:"opts",style:"margin-bottom:14px"});
  const body=el("div");card.append(modes,dirBar,body);
  let mode="flash",en2de=true;
  const dirB=el("button",{class:"opt",type:"button",style:"min-width:auto"},"English → Deutsch");
  dirB.onclick=()=>{en2de=!en2de;dirB.innerHTML=en2de?"English → Deutsch":"Deutsch → English";show()};
  dirBar.append(dirB,el("span",{class:"hint",style:"margin:6px 0 0"},"tap to change direction"));
  [["flash","Flashcards"],["quiz","Quiz"],["write","Write it"],["list","Word list"]].forEach(([k,label])=>{
    const b=el("button",{class:"opt",type:"button"},label);
    b.onclick=()=>{mode=k;[...modes.children].forEach(x=>x.classList.remove("right"));b.classList.add("right");show()};
    if(k===mode)b.classList.add("right");
    modes.appendChild(b);
  });
  function show(){body.innerHTML="";({flash,quiz,write,list})[mode]()}
  function flash(){

const WRITE_PHRASES=[
 ["Where and when","Last summer / Last August / In the holidays, I went to …","I was there for two weeks with my family."],
 ["Getting there","We travelled by car / train / plane.","The journey took about five hours."],
 ["Where you stayed","We stayed in a small hotel / an apartment / a campsite.","There was a swimming pool and the rooms were very nice."],
 ["What you did","Every morning we … / One day we … / In the evening we …","We swam in the sea, played volleyball and ate ice cream."],
 ["The best moment","The best day was when we …","It was really exciting / lovely / great fun."],
 ["Something that went wrong","Unfortunately, it rained for two days.","I lost my sunglasses and my brother wasn't very happy."],
 ["The end","We came home on Sunday.","It was the best holiday ever! I want to go there again."]
];
const CHECKLIST=[
 "I wrote in the simple past.",
 "I used complete sentences (every sentence has a subject and a verb).",
 "I used linking words: first, then, after that, at lunchtime, in the afternoon, finally.",
 "I wrote about all the important activities in the notes.",
 "After didn't I used the base form: didn't need, NOT didn't needed.",
 "I checked my irregular verbs (had, got, found, chose, did, was, were).",
 "My regular verbs end in -ed: stayed, cooked, stopped, watched, enjoyed.",
 "I wrote 80–100 words.",
 "I checked my spelling."
];
const MODEL=["Last August my family and I went to Cornwall for two weeks. We travelled by train and the journey took six hours.",
 "Our hotel was small, but the rooms were very nice and there was a lovely view of the sea. On the first day we walked to the beach and swam in the cold water. Dad bought ice creams for everybody and my brother dropped his in the sand!",
 "One evening we ate fish and chips on the harbour wall and watched the boats. We didn't see any dolphins, but we saw hundreds of seagulls. On the last day it rained all afternoon, so we stayed in the hotel and played cards.",
 "I didn't want to go home. It was the best holiday ever!"];
const BADFORMS={goed:"went",geted:"got",getted:"got",eated:"ate",drinked:"drank",maked:"made",buyed:"bought",seed:"saw",
 taked:"took",meeted:"met",haved:"had",writed:"wrote",singed:"sang",swimmed:"swam",runned:"ran",comed:"came",
 catched:"caught",bringed:"brought",thinked:"thought",teached:"taught",finded:"found",feeled:"felt",sleeped:"slept",
 speaked:"spoke",winned:"won",weared:"wore",knowed:"knew",sayed:"said",builded:"built",breaked:"broke",drived:"drove",
 payed:"paid",loosed:"lost",telled:"told",sended:"sent",spended:"spent",flied:"flew",rided:"rode",selled:"sold",
 visitit:"visited",wantet:"wanted",hauped:"hoped",stoped:"stopped",plaied:"played",studyed:"studied",cryed:"cried",
 staied:"stayed",staied:"stayed",enjo:"enjoyed",enjoied:"enjoyed",enjoy:"enjoyed",beacurse:"because",becurse:"because",
 choosed:"chose",cookt:"cooked",watchd:"watched",finded:"found",openned:"opened",droped:"dropped",hurryed:"hurried"};

function checkText(t){
  const low=" "+t.toLowerCase().replace(/[^a-z' ]/g," ").replace(/\s+/g," ")+" ";
  const found=[];
  for(const bad in BADFORMS){if(low.includes(" "+bad+" "))found.push(`“${bad}” → ${BADFORMS[bad]}`)}
  (low.match(/ did ?n'?t \w+ed /g)||[]).forEach(m=>found.push(`“${m.trim()}” → after didn't use the base form`));
  (low.match(/ did \w+ \w+ed /g)||[]).forEach(m=>found.push(`“${m.trim()}” → after did use the base form`));
  IRR.forEach(([base,past])=>{
    if(base===past)return;
    if(new RegExp(" did ?n'?t "+past+" ").test(low))found.push(`“didn't ${past}” → didn't ${base}`);
    if(new RegExp(" did \\w+ "+past+" ").test(low))found.push(`“did … ${past}” → did … ${base}`);
  });
  [[" we was ","we were"],[" they was ","they were"],[" you was ","you were"],[" i were ","I was"],
   [" he were ","he was"],[" she were ","she was"],[" it were ","it was"]].forEach(([bad,good])=>{
    if(low.includes(bad))found.push(`“${bad.trim()}” → ${good}`);
  });
  // "I no needed" instead of "I didn't need"
  (low.match(/ (i|we|they|he|she|you) no \w+/g)||[]).forEach(m=>found.push(`“${m.trim()}” → use didn't + base form (I didn't need…)`));
  if(/ no need(ed)? to /.test(low))found.push("“no need(ed) to” → I didn't need to…");
  // present tense left in the text
  const BASES=["have","go","get","eat","watch","play","stay","cook","find","choose","do","stop","enjoy","open","need","buy","see","take","meet","wake","build","drink","make","wait","walk","arrive","travel"];
  BASES.forEach(v=>{
    const re=new RegExp(" (i|we|they|he|she|my \\w+) "+v+" ","g");
    (low.match(re)||[]).forEach(m=>{if(!/ (i|we|they|he|she) (have|need) to /.test(m))found.push(`“${m.trim()}” → is this the simple past?`)});
  });
  [" i am "," we are "," they are "," he is "," she is "," it is "," are my "," is my "].forEach(m=>{
    if(low.includes(m))found.push(`“${m.trim()}” → in a past text use was / were`);
  });
  const sentences=t.split(/[.!?]+/).filter(x=>x.trim().length>3).length;
  const words=t.trim().split(/\s+/).filter(Boolean).length;
  const pastVerbs=(low.match(/\w+ed /g)||[]).length+IRR.filter(v=>low.includes(" "+v[1]+" ")).length+((low.match(/ (was|were) /g)||[]).length);
  const linkers=LINKERS.filter(l=>low.includes(" "+l+" "));
  const notes=[
    `Words: ${words} ${words>=80?"✓":"– the task asks for 80–100."}`,
    `Sentences: ${sentences} ${sentences>=8?"✓":"– try to write at least 8."}`,
    `Past verbs found: ${pastVerbs} ${pastVerbs>=6?"✓":"– use more simple past."}`,
    `Linking words: ${linkers.length?linkers.join(", "):"none"} ${linkers.length>=4?"✓":"– use first, then, after that, at lunchtime, in the afternoon, finally."}`
  ];
  return {found:[...new Set(found)],notes};
}
function renderCheck(fb,t){
  const {found,notes}=checkText(t);
  if(!t.trim()){fb.className="fb no";fb.textContent="Write your text first.";return}
  if(found.length){fb.className="fb no";fb.innerHTML="<b>Check these:</b><br>"+found.map(esc).join("<br>")+"<br><br>"+notes.map(esc).join("<br>")}
  else{fb.className="fb ok";fb.innerHTML="<b>No typical verb mistakes found. Well done!</b><br>"+notes.map(esc).join("<br>")+"<br><br>Now read your text out loud and check the spelling."}
}

function buildQuiz(){
  const id="quiz";

    ...pick(WW,3).map(([q,a])=>({q,a,opts:["was","were"]})),
    ...pick(TH,2).map(([q,a])=>({q,a,opts:THERE_OPTS})),
    ...pick(POS,5).map(([q,a,base])=>{
      const fake=base.endsWith("e")?base+"d":base+"ed";
      const others=pick(POS.filter(p=>p[1]!==a&&p[1]!==fake),3).map(p=>p[1]);
      const opts=[...new Set([a,...(fake!==a?[fake]:[]),...others])].slice(0,4);
      return {q,a,opts:shuffle(opts)};
    }),
    ...pick(IRR,3).map(([b,p])=>({q:`${b}  →  ?`,a:p,opts:shuffle([p,b.endsWith("e")?b+"d":b+"ed",...pick(IRR.filter(v=>v[1]!==p),2).map(v=>v[1])])})),
    ...pick(NEG_PAST,2).map(([s,a])=>{const v=a.match(/didn't (\w+)/)[1];
      return {q:a.replace("didn't "+v,"didn't ___"),a:v,opts:shuffle([v,v.endsWith("e")?v+"d":v+"ed",v+"s",v+"ing"])}}),
    ...pick(QS_PAST,2).map(([p,y,q,ans])=>{const v=q.match(/^Did [\w\s]+? (\w+)/);const base=v?v[1]:"go";
      return {q:q.replace(" "+base+" "," ___ "),a:base,opts:shuffle([base,base.endsWith("e")?base+"d":base+"ed",base+"s",base+"ing"])}})
  ]);
  pool.forEach(it=>{if(!it.opts.includes(it.a))it.opts[0]=it.a;it.opts=[...new Set(it.opts)]});
  const card=el("section",{class:"card"});card.append(el("h2",{},"Repaso mezclado"),el("p",{class:"hint"},`${pool.length} mixed questions. One at a time – no going back!`));
  const box=el("div");card.appendChild(box);let i=0,got=0;const missed=[];
  function show(){
    box.innerHTML="";
    if(i>=pool.length){
      const pct=Math.round(got/pool.length*100);
      const msg=pct===100?"Perfect! You're ready for the test.":pct>=80?"Great job! Look at the mistakes and try once more.":pct>=60?"Good work. Read the rules again and try once more.":"Read the rules at the top and practise the sections again.";
      const r=el("div",{class:"result"},`<div class="n">${got}/${pool.length}</div><p><b>${msg}</b></p>`);
      if(missed.length){r.appendChild(el("p",{class:"hint",style:"text-align:left"},"Check these:<br>"+missed.map(esc).join("<br>")))}
      const again=el("button",{class:"btn",type:"button"},"Empezar otro repaso");again.onclick=()=>render();r.appendChild(again);
      box.appendChild(r);if(got===pool.length){done[id]=true;renderNav()}return;
    }
    const it=pool[i];
    box.appendChild(el("p",{class:"hint",style:"margin:0 0 4px"},`Question ${i+1} of ${pool.length} &nbsp; Score: ${got}`));
    box.appendChild(el("p",{class:"q",style:"font-size:20px"},esc(it.q).replace("___","<b>______</b>")));
    const opts=el("div",{class:"opts"});const fb=el("div",{class:"fb"});
    it.opts.forEach(o=>{const b=el("button",{class:"opt",type:"button"},esc(o));
      b.onclick=()=>{opts.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add("right")});
        if(o===it.a){got++;fb.className="fb ok";fb.textContent="Correct!"}else{b.classList.add("wrong");fb.className="fb no";fb.textContent="Answer: "+it.a;missed.push(it.q.replace("___",it.a).replace(/ \((\+|–|\?)\)$/,""))}
        const nx=el("button",{class:"btn",type:"button",style:"margin-top:14px"},i===pool.length-1?"See my score":"Next question");nx.onclick=()=>{i++;show()};box.appendChild(nx);nx.focus();
      };opts.appendChild(b)});

               ...pick(SORT.filter(v=>v[2]===3),2),...pick(SORT.filter(v=>v[2]===4),2)];

    const row=el("div",{class:"item"});

    const fb=el("div",{class:"fb"});

  });
  footer(card,()=>{
    let got=0;rows.forEach(r=>{
      const okG=r.chosen===r.g, okP=raw(r.inp.value)===r.past;
      [...r.opts.children].forEach((b,i)=>{b.classList.remove("right","wrong");if(i+1===r.g)b.classList.add("right");
        else if(i+1===r.chosen)b.classList.add("wrong")});
      r.inp.className="short "+(okP?"right":"wrong");
      got+=(okG?1:0)+(okP?1:0);
      r.fb.className="fb "+(okG&&okP?"ok":"no");
      r.fb.textContent=okG&&okP?"Correct!":`${SORT_GROUPS[r.g]} → ${r.past}`;

    body.innerHTML="";

      graders.push(()=>{

          if(x.textContent===it.a)x.classList.add("right");else if(x.textContent===sel)x.classList.add("wrong")});

      });

    {
      const row=el("div",{class:"item"});

      cur.b.opts.forEach(o=>{
        const b4=el("button",{class:"opt",type:"button",style:"font-size:16px"},esc(o));

          if(sel.has(o)){sel.delete(o);b4.classList.remove("sel")}
          else{sel.add(o);b4.classList.add("sel")}

        };
        opts.appendChild(b4);
      });
      row.append(opts,fb);body.appendChild(row);
      graders.push(()=>{
        let good=0,bad=0;

          const o=x.textContent;

    const out=el("div");host.appendChild(out);

    fin.onclick=async ()=>{
      let got=0;const missed=[];
      rows.forEach(r=>{
        const ok=r.grade();
        if(ok)got++;else missed.push(r.label());
      });
      fin.disabled=true;
      const pct=Math.round(got/rows.length*100);
      const msg=pct>=90?"Muy bien. Está preparada.":pct>=70?"Bien. Repasa los fallos y vuelve a intentarlo.":
                pct>=50?"Hay que repasar. Mira las reglas de arriba y haz los ejercicios de esa parte.":
                "Toca repasar en serio esta parte antes del examen.";
      const res=el("div",{class:"result"},`<div class="n">${got}/${rows.length}</div><p><b>${esc(msg)}</b></p>`);
      out.appendChild(res);
      if(missed.length){
        out.appendChild(el("p",{class:"hint",style:"text-align:left"},
          "<b>Para repasar:</b><br>"+missed.map(esc).join("<br>")));
      }
      if(ta){
        const fb=el("div",{class:"fb",style:"font-size:16px;margin-top:10px"});
        out.appendChild(el("p",{class:"q",style:"margin-top:14px"},"<b>Tu redacción</b>"));
        out.appendChild(fb);renderCheck(fb,ta.value);
      }
      const saved=await saveResult({test:t.id,title:t.title,
        score:got,total:rows.length,pct,missed:missed.slice(0,12),
        date:todayISO(),ts:Date.now(),words:ta?ta.value.trim().split(/\s+/).filter(Boolean).length:0});
      out.appendChild(el("p",{class:"hint",style:"margin-top:12px"},
        saved?"Resultado guardado. Lo puedes ver en la pestaña Resultados.":
              "El resultado no se ha podido guardar en esta sesión, pero la nota es la de arriba."));
      out.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  }

  function addRow(host,q,n){
    const row=el("div",{class:"item"});
    if(q.tag)row.appendChild(el("p",{class:"tagline"},`<span class="qnum">${n}.</span>${esc(q.tag)}`));
    row.appendChild(el("p",{class:"q"},(q.tag?"":`<span class="qnum">${n}.</span>`)+esc(q.q)));
    const fb=el("div",{class:"fb"});
    if(q.t==="mc"){
      const opts=el("div",{class:"opts"});let sel=null;
      q.opts.forEach(o=>{
        const b=el("button",{class:"opt",type:"button",style:"font-size:16px"},esc(o));
        b.onclick=()=>{sel=o;[...opts.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};
        opts.appendChild(b);
      });
      row.append(opts,fb);host.appendChild(row);
      return {grade(){
          const ok=sel===q.a;
          [...opts.children].forEach(b=>{b.disabled=true;b.classList.remove("sel");
            if(b.textContent===q.a)b.classList.add("right");
            else if(b.textContent===sel)b.classList.add("wrong")});
          fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Correcto":"Respuesta: "+q.a;
          return ok;},
        label(){return `${n}. ${strip(q.q)}  =  ${q.a}`}};
    }
    const inp=el("input",{type:"text",autocomplete:"off",autocapitalize:"sentences",spellcheck:"false"});
    row.append(inp,fb);host.appendChild(row);
    return {grade(){
        const ok=q.a.some(x=>same(inp.value,x));
        inp.className=ok?"right":"wrong";inp.disabled=true;
        fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Correcto":"Respuesta: "+q.a[0];
        return ok;},
      label(){return `${n}. ${strip(q.q)}  =  ${q.a[0]}`}};
  }
}

function buildResults(){
  const card=el("section",{class:"card"});
  card.append(el("h2",{},"Resultados"),el("p",{class:"hint"},"Las notas de cada test, de la más reciente a la más antigua."));
  const body=el("div");card.appendChild(body);
  if(!capsReady){body.appendChild(el("p",{class:"hint"},"Cargando…"));initCaps();return card}
  if(!DB){
    body.appendChild(el("p",{class:"hint"},
      "Las notas no se pueden guardar en esta vista. Puede ser que no hayas iniciado sesión, o que esta copia de la página no tenga permiso. Los tests funcionan igual y muestran la nota al terminar."));
    return card;
  }
  body.appendChild(el("p",{class:"hint"},"Cargando…"));
  DB.collection("results").orderBy("ts","desc").limit(50).get().then(snap=>{
    body.innerHTML="";
    if(snap.empty){body.appendChild(el("p",{class:"hint"},"Todavía no hay ningún test hecho."));return}
    const head=el("div",{class:"res",style:"border-top:0;font-weight:800;color:var(--muted);font-size:13px"});
    head.append(el("div",{},"Test"),el("div",{},"Nota"),el("div",{},"Fecha"));
    body.appendChild(head);
    snap.docs.forEach(d=>{
      const r=d.data();
      const cls=r.pct>=90?"a":r.pct>=70?"b":"c";
      const row=el("div",{class:"res"});
      row.append(el("div",{},esc(r.title||r.test||"")),
                 el("div",{},`<span class="pill ${cls}">${r.score}/${r.total}</span>`),
                 el("div",{class:"ex"},esc(r.date||"")));
      body.appendChild(row);
      if(r.missed&&r.missed.length){
        body.appendChild(el("p",{class:"hint",style:"margin:4px 0 10px;font-size:14px"},
          "Falló: "+r.missed.map(esc).join(" · ")));
      }
    });
  }).catch(()=>{
    body.innerHTML="";
    body.appendChild(el("p",{class:"hint"},"No se han podido leer los resultados ahora mismo."));
  });
  return card;
}

function vocSetMC(title,hint,set,id){
  const items=pick(set,10).map(w=>{
    const wrong=distractors(set,w,3).map(x=>x[1]);
    return {q:w[0],a:w[1],opts:shuffle([w[1],...wrong])};
  });
  return buildChoice(title,hint,items,id);
}
const vocMode={};
function bare(w){return w.replace(/^(a|an|the|to) /,"")}
// evita distractores que comparten significado alemán con la respuesta
function deParts(t){return t.toLowerCase().split(/[,;]\s*/).map(x=>x.trim()).filter(Boolean)}
function notSynonym(w,other){
  const a=deParts(w[1]),b=deParts(other[1]);
  return !a.some(x=>b.includes(x))&&bare(w[0])!==bare(other[0]);
}
// tres distractores que no se solapan ni con la respuesta ni entre ellos
function distractors(set,w,n){
  const out=[];
  shuffle(set.filter(x=>notSynonym(w,x))).forEach(c=>{
    if(out.length<n&&out.every(o=>notSynonym(c,o)))out.push(c);
  });
  return out;
}
function vocSetType(title,hint,set,id){
  const card=el("section",{class:"card"});
  card.append(el("h2",{},title),el("p",{class:"hint"},hint));
  const bar=el("div",{class:"modebar"});
  const bW=el("button",{type:"button"},"Escribirla");
  const bC=el("button",{type:"button"},"Elegirla");
  bar.append(bW,bC);card.appendChild(bar);
  const host=el("div");card.appendChild(host);
  function show(mode){
    vocMode[id]=mode;
    bW.className=mode==="w"?"on":"";bC.className=mode==="c"?"on":"";
    host.innerHTML="";
    let inner;
    if(mode==="w"){
      const items=pick(set,10).map(w=>({q:w[1]+"   →   "+bare(w[0])[0]+"…",a:[w[0],bare(w[0])]}));
      inner=buildType("","",items,id);
    }else{
      const items=pick(set,10).map(w=>{
        const wrong=distractors(set,w,3).map(x=>x[0]);
        return {q:w[1],a:w[0],opts:shuffle([w[0],...wrong])};
      });
      inner=buildChoice("","",items,id);
    }
    inner.querySelector("h2").remove();
    const h=inner.querySelector(".hint");if(h)h.remove();
    inner.className="";host.appendChild(inner);
  }
  bW.onclick=()=>show("w");bC.onclick=()=>show("c");
  show(vocMode[id]||"w");
  return card;
}

  <div style="margin-top:10px">
    <div class="rule"><span class="rn">1</span><div><p><b>Las cuatro reglas del -ed</b></p><p class="ex">normal: walk → walk<b>ed</b> &nbsp;·&nbsp; acaba en -e: arrive → arrive<b>d</b><br>consonante + y: study → stud<b>ied</b> &nbsp;·&nbsp; palabra corta: stop → sto<b>pped</b></p></div></div>
    <div class="rule"><span class="rn">2</span><div><p><b>Vocal + y no cambia</b></p><p class="ex">stay → <b>stayed</b> · play → <b>played</b> · enjoy → <b>enjoyed</b> &nbsp;(no "staied")</p></div></div>
    <div class="rule"><span class="rn">3</span><div><p><b>Los irregulares hay que aprenderlos</b></p><p class="ex">No llevan -ed nunca. Los del libro: choose, come, do, go, make, meet, say, see, sit, take, think, begin, break, draw, drink, eat, feel, get, give, know, read, drive.</p></div></div>
    <div class="rule"><span class="rn">4</span><div><p><b>Cómo se pronuncia el -ed</b></p><p class="ex">Después de <b>t</b> o <b>d</b> se oye una sílaba más [ɪd]: want·ed, need·ed, start·ed, visit·ed.</p></div></div>
  </div>`;
const RULES_POS=`
  <div class="rule"><span class="rn">1</span><div><p><b>Una sola forma para todos</b></p><p class="ex">I played · he played · they played. Nunca "he playeds".</p></div></div>
  <div class="rule"><span class="rn">2</span><div><p><b>be en pasado: was y were</b></p><p class="ex"><span class="was">was</span> → I, he, she, it &nbsp;·&nbsp; <span class="were">were</span> → you, we, they</p></div></div>
  <div class="rule"><span class="rn">3</span><div><p><b>there was / there were</b></p><p class="ex">There <b>was</b> a cake. There <b>were</b> three dogs. There <b>was</b> lots of rain.</p></div></div>
  <div class="rule"><span class="rn">4</span><div><p><b>Palabras de tiempo pasado</b></p><p class="ex">yesterday, last night, last summer, two days ago, in July, on Sunday</p></div></div>
  <div class="rule"><span class="rn">5</span><div><p><b>El sujeto va delante del verbo</b></p><p class="ex">At lunchtime <b>my brothers were</b> at home. (no "At lunchtime were my brothers…")</p></div></div>`;
const RULES_NEG=`
  <div class="split">
    <div class="box w1"><b>didn't</b>+ infinitivo<br><span class="ex">I didn't go · she didn't play</span></div>
    <div class="box w2"><b>wasn't<br>weren't</b><span class="ex">solo con el verbo be</span></div>
  </div>
  <div style="margin-top:10px">
    <div class="rule"><span class="rn">1</span><div><p><b>didn't + forma base</b></p><p class="ex">I <b>didn't need</b> to get dressed. · She <b>didn't go</b> home.<br><span class="was">Nunca</span> "didn't went" ni "didn't needed".</p></div></div>
    <div class="rule"><span class="rn">2</span><div><p><b>El pasado aparece una sola vez</b></p><p class="ex">I <b>went</b> home.  →  I didn't <b>go</b> home.</p></div></div>
    <div class="rule"><span class="rn">3</span><div><p><b>Con be no se usa didn't</b></p><p class="ex">He <b>wasn't</b> at school. We <b>weren't</b> hungry.</p></div></div>
    <div class="rule"><span class="rn">4</span><div><p><b>don't / doesn't es presente</b></p><p class="ex">don't / doesn't → <b>didn't</b> en pasado.</p></div></div>
  </div>`;
const RULES_Q=`
  <div class="split">
    <div class="box w1"><b>Did …?</b>+ infinitivo<br><span class="ex">Did you play football?</span></div>
    <div class="box w2"><b>Was / Were …?</b><span class="ex">Was Lily at the beach?</span></div>
  </div>
  <div style="margin-top:10px">
    <div class="rule"><span class="rn">1</span><div><p><b>Did + sujeto + infinitivo</b></p><p class="ex"><b>Did</b> you <b>play</b> football? &nbsp;(no "Did you played")</p></div></div>
    <div class="rule"><span class="rn">2</span><div><p><b>Respuestas cortas</b></p><p class="ex">Yes, I <b>did</b>. / No, I <b>didn't</b>. &nbsp;·&nbsp; con be: Yes, she <b>was</b>. / No, they <b>weren't</b>.</p></div></div>
    <div class="rule"><span class="rn">3</span><div><p><b>Con palabra interrogativa, delante</b></p><p class="ex">Where <b>did</b> you <b>go</b>? · How <b>was</b> the film? · What <b>did</b> she <b>eat</b>?</p></div></div>
    <div class="rule"><span class="rn">4</span><div><p><b>Si preguntas por el sujeto, sin did</b></p><p class="ex">Lily visited Alice. → <b>Who visited Alice?</b> &nbsp;(no "Who did visit")</p></div></div>
    <div class="rule"><span class="rn">5</span><div><p><b>do / does en presente → did en pasado</b></p><p class="ex">Where <b>does</b> she live?  →  Where <b>did</b> she live?</p></div></div>
  </div>`;


// ---------- secciones con subsecciones plegables ----------
function subStack(subs){
  return ()=>{
    const wrap=el("div");
    subs.forEach((sub,i)=>{
      const d=el("details",{class:"subsec"});
      if(i===0)d.open=true;
      d.appendChild(el("summary",{},esc(sub.name)+(done[sub.id]?' <span class="tick">✓</span>':"")));
      const c=sub.build();c.classList.add("inner");
      d.appendChild(c);wrap.appendChild(d);
    });
    return wrap;
  };
}
function sect(id,name,subs){return {id,name,subs:subs.map(x=>x.id),build:subStack(subs)}}

function curGroup(){return GROUPS.find(g=>g.id===group)}
function renderGroups(){
  const bar=document.getElementById("groups");bar.innerHTML="";
  GROUPS.forEach(g=>{
    const b=el("button",{class:g.id===group?"on":"",type:"button"},esc(g.name));
    b.onclick=()=>{group=g.id;current=g.sections[0].id;render();window.scrollTo({top:0,behavior:"smooth"})};
    bar.appendChild(b);
  });
}
function renderRules(){
  const box=document.getElementById("rulesbox");box.innerHTML="";
  const g=curGroup();if(!g.rules)return;
  const d=el("details",{class:"card rules",open:""});
  d.appendChild(el("summary",{},"How it works – the rules"));
  d.appendChild(el("div",{},g.rules));
  box.appendChild(d);
}
function renderNav(){
  const nav=document.getElementById("nav");nav.innerHTML="";
  const g=curGroup();
  if(g.sections.length<2){nav.style.display="none";return}
  nav.style.display="flex";
  g.sections.forEach(s=>{
    const ok=s.subs?s.subs.every(i=>done[i]):done[s.id];
    const b=el("button",{class:s.id===current?"on":"",type:"button"},esc(s.name)+(ok?' <span class="done">✓</span>':""));
    b.onclick=()=>{current=s.id;render();document.getElementById("nav").scrollIntoView({behavior:"smooth",block:"start"})};
    nav.appendChild(b);
  });
}
function render(){
  const g=curGroup();
  if(!g.sections.some(s=>s.id===current))current=g.sections[0].id;
  renderGroups();renderRules();renderNav();
  const m=document.getElementById("main");m.innerHTML="";
  m.appendChild(g.sections.find(s=>s.id===current).build());
}
current=GROUPS[0].sections[0].id;
group="tests";
render();
initCaps();
