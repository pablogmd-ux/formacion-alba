function normalize(s){
  return (s||"").toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/ß/g,"ss")
    .replace(/[.!?,;:]+$/g,"")
    .replace(/\s+/g," ").trim();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- Rendering ---------- */
const nav=document.getElementById('nav'), main=document.getElementById('main');
const sections=[
  {id:"genitiv",label:"Genitiv"},{id:"esgeht",label:"Es geht um"},
  {id:"weg",label:"Wegbeschreibung"},{id:"gegenstand",label:"Gegenstand & Suchanzeige"},{id:"vokabular",label:"Vokabular Gegenstand"},
  {id:"schreiben",label:"Schreiben üben"},{id:"test",label:"TEST",cls:"test"}
];
sections.forEach(s=>{const b=document.createElement('button');b.textContent=s.label;if(s.cls)b.className=s.cls;b.onclick=()=>show(s.id);b.dataset.id=s.id;nav.appendChild(b);});

function renderItems(items,container,opts={}){
  const state={total:items.length,done:0,right:0,byCat:{}};
  items.forEach((it,i)=>{
    const q=document.createElement('div');q.className='q';
    const cat=it.cat?`<span class="tag">${DB[it.cat].title}</span>`:"";
    q.innerHTML=`<div class="num">Aufgabe ${i+1}${opts.showCat?cat:""}</div><div class="text">${it.t}</div>`;
    const fb=document.createElement('div');fb.className='fb';
    const mark=(ok,correct)=>{
      if(it._done)return; it._done=true; state.done++; if(ok)state.right++;
      if(it.cat){const c=state.byCat[it.cat]||(state.byCat[it.cat]={r:0,n:0});c.n++;if(ok)c.r++;}
      fb.textContent=ok?"Richtig!":"Falsch. Richtig: "+correct; fb.className='fb '+(ok?'ok':'bad');
      if(opts.onAnswer)opts.onAnswer(state);
    };
    if(it.type==="in"){
      const inp=document.createElement('input');inp.type='text';inp.placeholder='Antwort eintippen … (Enter)';
      inp.autocapitalize='off';inp.autocomplete='off';inp.spellcheck=false;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){check();}});
      const check=()=>{if(it._done)return;const v=normalize(inp.value);if(!v)return;const ok=it.a.some(x=>normalize(x)===v);inp.className=ok?'ok':'bad';inp.readOnly=true;mark(ok,it.a[0]);};
      inp.addEventListener('blur',()=>{if(inp.value.trim())check();});
      q.appendChild(inp);
    }else{
      const o=document.createElement('div');o.className='opts';
      it.o.forEach((txt,k)=>{const b=document.createElement('button');b.innerHTML=txt;b.onclick=()=>{if(it._done)return;const ok=k===it.a;b.className=ok?'ok':'bad';if(!ok)o.children[it.a].className='ok';mark(ok,it.o[it.a].replace(/<[^>]+>/g,''));};o.appendChild(b);});
      q.appendChild(o);
    }
    q.appendChild(fb);container.appendChild(q);
  });
  return state;
}

function show(id){
  [...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  main.innerHTML='';window.scrollTo(0,0);
  if(id==='test')return renderTest();
  if(id==='schreiben')return renderWriting();
  const sec=DB[id];
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<h2>${sec.title}</h2><div class="rule">${sec.rule}</div><p class="hint">Tippe die Antwort und drücke Enter – oder wähle eine Option. Groß-/Kleinschreibung ist egal.</p>`;
  const list=document.createElement('div');card.appendChild(list);
  const score=document.createElement('div');score.className='score';card.appendChild(score);
  const items=shuffle(sec.items.map(x=>({...x,_done:false})));
  const st=renderItems(items,list,{onAnswer:s=>{score.textContent=`${s.right} von ${s.done} richtig (${s.total} Aufgaben)`;}});
  const act=document.createElement('div');act.className='actions';
  const re=document.createElement('button');re.className='btn sec';re.textContent='Neu mischen';re.onclick=()=>show(id);act.appendChild(re);
  card.appendChild(act);main.appendChild(card);
}

/* ---------- Test-Modus ---------- */
function renderTest(){
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<h2>Kontrolltest</h2><p class="hint">25 gemischte Aufgaben aus allen Themen. Am Ende siehst du, wo du noch üben musst. Du kannst die Antworten nicht korrigieren – wie in der Klassenarbeit!</p>`;
  const list=document.createElement('div');card.appendChild(list);
  let pool=[];
  for(const k in DB){pool=pool.concat(DB[k].items.map(x=>({...x,cat:k,_done:false})));}
  // ausgewogen: ~6 pro Thema
  let picked=[];
  for(const k in DB){picked=picked.concat(shuffle(pool.filter(x=>x.cat===k)).slice(0,k==='esgeht'?4:k==='genitiv'?6:k==='weg'?6:k==='vokabular'?4:5));}
  picked=shuffle(picked).slice(0,25);
  const result=document.createElement('div');
  const st=renderItems(picked,list,{showCat:true,onAnswer:s=>{if(s.done===s.total)showResult(s,result);}});
  card.appendChild(result);
  const act=document.createElement('div');act.className='actions';
  const fin=document.createElement('button');fin.className='btn warn';fin.textContent='Test beenden & auswerten';
  fin.onclick=()=>{picked.forEach(it=>{if(!it._done){it._done=true;st.done++;const c=st.byCat[it.cat]||(st.byCat[it.cat]={r:0,n:0});c.n++;}});showResult(st,result);};
  act.appendChild(fin);
  const re=document.createElement('button');re.className='btn sec';re.textContent='Neuer Test';re.onclick=()=>show('test');act.appendChild(re);
  card.appendChild(act);main.appendChild(card);
}
function showResult(s,el){
  const pct=Math.round(100*s.right/s.total);
  let html=`<div class="rule" style="margin-top:14px"><b>Ergebnis: ${s.right} / ${s.total} (${pct} %)</b> – ${pct>=90?"Sehr gut!":pct>=75?"Gut, kleine Lücken.":pct>=60?"Geht so – üben!":"Noch viel üben!"}</div><table><tr><th>Thema</th><th>richtig</th><th></th></tr>`;
  for(const k in s.byCat){const c=s.byCat[k];const p=Math.round(100*c.r/c.n);const cls=p<60?'low':p<80?'mid':'';
    html+=`<tr><td>${DB[k].title}</td><td>${c.r}/${c.n}</td><td style="width:40%"><div class="bar"><div class="${cls}" style="width:${p}%"></div></div></td></tr>`;}
  html+=`</table><p class="hint" style="margin-top:8px">Rot/orange = hier nochmal im Übungsbereich arbeiten.</p>`;
  el.innerHTML=html;el.scrollIntoView({behavior:'smooth'});
}

   check:["Start und Ziel sind genannt","Reihenfolge-Wörter: zuerst, dann, nun, schließlich","Richtungsangaben: geradeaus, links/rechts, vorbei an, bis zu, durch","Mindestens 4 Wegmarken (Treppe, Tür, Plakat, Baum …)","Alles im Präsens","Sachlich – keine Meinung, keine überflüssigen Infos","Rechtschreibung geprüft (schließlich, Eingangstür, Schließfächer)"]},
  {title:"Suchanzeige",task:"Du hast deinen Rucksack (oder dein Skateboard) im Park verloren. Schreibe eine Suchanzeige: Überschrift, Einleitung (wann/wo), Hauptteil (Bestandteile + Besonderheiten), Schluss (Kontakt + Dank).",
   check:["Überschrift mit „vermisst!“ oder „verloren!“","Einleitung: Datum und Ort","Hauptteil: mindestens 3 Bestandteile mit Form/Farbe/Material","Besonderheiten (Aufkleber, Kratzer, Anhänger …)","Abwechslungsreiche Verben: besitzen, bestehen aus, auffallen, ins Auge springen","Satzanfänge: Besonders …, Auffällig …, Außerdem …, Darüber hinaus …","Schluss: E-Mail-Adresse + „Ich bin dankbar für jeden Hinweis!“ + Unterschrift"]},
  {title:"Gegenstandsbeschreibung",task:"Beschreibe dein Federmäppchen oder deine Trinkflasche in drei Abschnitten: 1) Art, Größe, Form, Hauptmaterial, Hauptfarbe, Gebrauch – 2) Bestandteile mit Form, Farbe, Material – 3) Besonderheiten.",
   check:["Abschnitt 1: Art + Größe (ungefähr … cm) + Form + Hauptmaterial + Hauptfarbe + wofür","Abschnitt 2: jeden Bestandteil mit Form, Farbe UND Material","Abschnitt 3: Besonderheiten des Gegenstands oder Gebrauchs","Anschauliche Adjektive (hellblau, geriffelt, abgerundet, matt …)","Verben variieren: besitzen, bestehen aus, aufweisen, sich befinden, vorhanden sein","Sachlich, Präsens, keine „ich finde“-Sätze"]}
];
function renderWriting(){
  WRITING.forEach((w,i)=>{
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<h2>${w.title}</h2><div class="rule">${w.task}</div><textarea placeholder="Hier schreiben …"></textarea><p class="hint" style="margin-top:10px">Danach selbst prüfen – hake ab, was erfüllt ist:</p><ul class="check" style="list-style:none;padding:0">${w.check.map(c=>`<li><label><input type="checkbox">${c}</label></li>`).join('')}</ul><p class="hint">Tipp: Text abfotografieren oder per E-Mail an Papa schicken zum Korrigieren.</p>`;
    main.appendChild(card);
  });
}

show('genitiv');
