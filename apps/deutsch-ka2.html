<style>
/* VOICE: lúdico y claro, para una alumna de Klasse 6; papá lee las notas en español.

   PICTURE: un jinete sobre una bala de cañón cruzando el cielo, en la cabecera.
   COLOUR and TYPE: cobalto dominante, rosa de apoyo, amarillo girasol como acento; Fredoka + Atkinson.
   LAYOUT: cabecera con dibujo, pestañas que se envuelven, una columna de ejercicios de 760px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1533);--ink:light-dark(#141a3a,#eef1ff);--muted:light-dark(#57607f,#a9b1d6);
--blue:light-dark(#2347c5,#7f9bff);--blue-soft:light-dark(#e7edff,#1b2552);--pink:light-dark(#e2457f,#ff8db5);
--sun:#ffcb2e;--line:light-dark(#d9def0,#2c3668);--card:light-dark(#f6f8ff,#151d42);
--ok:light-dark(#137a43,#5fd894);--ok-soft:light-dark(#e3f7ea,#123824);--bad:light-dark(#c22d2d,#ff8a8a);--bad-soft:light-dark(#fde8e8,#3e1717)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(32px,6vw,48px)}h2{font-size:28px;color:var(--blue)}h3{font-size:20px}
.hero{background:var(--blue);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:16px;padding:28px max(5vw,16px) 0}
.hero p{color:#dfe6ff;margin:0 0 16px;max-width:36ch}
.hero .date{display:inline-block;background:var(--sun);color:#141a3a;font-weight:700;border-radius:999px;padding:4px 14px;margin-bottom:12px}
.hero svg{width:100%;height:auto;display:block}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:14px max(5vw,16px);border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.tabs button{font:600 16px Fredoka,sans-serif;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs .sc{font-size:13px;opacity:.85;margin-left:6px}
main{max-width:800px;margin:0 auto;padding:24px 16px 64px}
.theory{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:22px}
.theory ul{margin:.3em 0 .6em;padding-left:1.2em}
.papa{border-left:4px solid var(--pink);background:light-dark(#fff1f6,#2a1630);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:15px}
.papa b{color:var(--pink)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.steps div{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.steps strong{display:block;font-family:Fredoka,sans-serif;color:var(--blue);font-size:18px}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}th{background:var(--blue-soft)}
.end{color:var(--pink);font-weight:700}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px;background:var(--bg)}
.q .n{color:var(--muted);font-size:14px}
.q p{margin:.2em 0 .6em;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.go{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.opts button:focus-visible,.go:focus-visible,input:focus-visible,.tabs button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opts button.ok{background:var(--ok-soft);border-color:var(--ok)}.opts button.bad{background:var(--bad-soft);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px}
input[type=text]{font:inherit;font-size:17px;min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);flex:1 1 220px}
.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.fb{margin-top:8px;font-size:15px;border-radius:8px;padding:8px 10px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}.fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.meter{flex:1 1 200px;height:12px;background:var(--blue-soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.tag{display:inline-block;margin-left:8px;font-size:13px;font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:99px;padding:0 8px}
.pending{border:2px dashed var(--pink);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
@media(max-width:600px){.hero{grid-template-columns:1fr;padding-top:22px}.steps{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}.ball{animation:none!important}}
.ball{animation:fly 6s ease-in-out infinite}
@keyframes fly{50%{transform:translate(-14px,-8px)}}
</style>
</head>

<h2>Eine eigene Lügengeschichte schreiben (S. 96)</h2>
<div class="theory">
<h3>1. Planen – die Karteikarten</h3>
<div class="steps">
<div><strong>Wer? Wo? Was?</strong>der Erzähler / die Erzählerin · der Handlungsort · die Lüge</div>
<div><strong>Anfang</strong>die <b>Wahrheit am Anfang</b>: alles klingt normal und glaubhaft.</div>
<div><strong>Hauptteil → Ende</strong>die <b>Lügenkette im Hauptteil</b> · das <b>Betonen der Wahrheit am Ende</b></div>
</div>
<p>Situationen im Buch: <b>A</b> In einem Walbauch · <b>B</b> Ein Tag als Verwandlungskünstler · <b>C</b> Auf dem Weg zur Schule</p>
<h3>2. Schreiben – in der Ich-Form</h3>
<p>So kannst du beginnen: <b>„Wie ihr alle wisst, habe/bin/wollte/konnte ich schon immer …“</b></p>
<table class="stack"><thead><tr><th>Kasten</th><th>Formulierungen</th></tr></thead><tbody>
<tr><td>Übertreibungen formulieren</td><td>unglaublich · unbeschreiblich · schlagartig · ungeheuerlich · riesengroß · blitzschnell · klitzeklein · winzig · gigantisch · unzählbar</td></tr>
<tr><td>anschauliche Vergleiche formulieren</td><td>so groß wie … · so klein wie … · so schnell wie … · so langsam wie … · so schön wie … · so laut wie …</td></tr>
<tr><td>Ausrufe und wörtliche Rede verwenden</td><td>Ich konnte das nicht glauben! · Das war unglaublich! · Und wirklich! · Er erklärte mir: „…“ · „…“, fragte sie mich.</td></tr>
<tr><td>die Wahrheit betonen</td><td>Ich schwöre, dass … · Es klingt vielleicht unglaublich, aber … · Ihr werdet mir sicher zustimmen, dass … · Ich habe es mit eigenen Augen gesehen! · Das ist die Wahrheit. So wahr ich … heiße.</td></tr>
</tbody></table>
<h3>3. Überschrift und Rückmeldung</h3>
<p>Die <b>Überschrift</b> soll die Leser <b>neugierig</b> machen. Eine gute Geschichte hat <b>glaubhafte Stellen</b> und eine <b>Lügenkette</b> und ist unterhaltsam, lustig, spannend.</p>
</div>
<div class="papa"><b>Para papá:</b> lo más probable es que en el examen tenga que escribir una Lügengeschichte con las cajas de la S. 96. Que escriba una a mano (por ejemplo la situación A o C), me mandas la foto y la corrijo con rúbrica: estructura de las 6 tarjetas, fórmulas de cada caja, Ich-Form y Präteritum.</div>`;

const theoryLW=`
<h2>Wörter für „lügen“ (S. 86)</h2>
<div class="theory">
<p>Für das Wort <b>lügen</b> gibt es viele andere Ausdrücke:</p>
<table class="stack"><thead><tr><th>Ausdruck</th><th>Was es genau meint</th></tr></thead><tbody>
<tr><td>flunkern</td><td>harmlos ein bisschen lügen oder übertreiben, oft aus Spaß</td></tr>
<tr><td>schwindeln</td><td>eine kleine Lüge erzählen</td></tr>
<tr><td>austricksen</td><td>jemanden mit einem Trick überlisten</td></tr>
<tr><td>betrügen</td><td>jemanden täuschen, um selbst einen Vorteil zu haben</td></tr>
<tr><td>jemanden hinters Licht führen</td><td>jemanden täuschen</td></tr>
</tbody></table>
<p>Lügen: <b>er log</b> (Präteritum) · <b>er hat gelogen</b> (Perfekt)</p>
<h3>Arten von Lügen</h3>
<ul>
<li><b>unterhaltsame Lügen</b>: zum Spaß, zum Beispiel Lügengeschichten</li>
<li><b>kleine Lügen</b>: harmlos, zum Beispiel ein bisschen schwindeln</li>
<li><b>Notlügen</b>: man lügt, um jemanden nicht zu verletzen oder sich aus einer schwierigen Lage zu retten</li>
<li><b>bösartige Lügen</b>: man lügt, um anderen zu schaden oder sie zu betrügen</li>
</ul>
<p><b>Der Angler (Bilder 1 und 2):</b> Er behauptet, der Fisch war zwei Meter lang. In Wirklichkeit hat er einen winzigen Fisch gefangen.</p>
</div>
<div class="papa"><b>Para papá:</b> la S. 86 que pone el temario es la página de entrada del tema de la mentira, así que el vocabulario de la Lektion 8 son estas palabras. El libro solo las enumera; la columna con el matiz de cada una la he añadido yo. Si la profe dio otra definición en clase, vale la de la profe.</div>`;

<h2>n-Deklination</h2>
<div class="theory">
<p>Einige <b>maskuline</b> Nomen bekommen in <b>allen Fällen außer Nominativ Singular</b> die Endung <span class="end">-(e)n</span>.</p>
<table><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>
<tr><td>Nominativ</td><td>der Polizist</td><td>die Polizist<span class="end">en</span></td></tr>
<tr><td>Akkusativ</td><td>den Polizist<span class="end">en</span></td><td>die Polizist<span class="end">en</span></td></tr>
<tr><td>Dativ</td><td>dem Polizist<span class="end">en</span></td><td>den Polizist<span class="end">en</span></td></tr>
<tr><td>Genitiv</td><td>des Polizist<span class="end">en</span></td><td>der Polizist<span class="end">en</span></td></tr>
</tbody></table>
<h3>Diese Nomen aus den Arbeitsblättern gehören dazu</h3>
<ul>
<li><b>-ist, -ent, -ant, -at, -af, -et, -ot, -ekt</b>: der Journalist, Polizist, Assistent, Patient, Präsident, Praktikant, Musikant, Diplomat, Fotograf, Athlet, Pilot, Architekt → <b>-en</b></li>
<li><b>Maskulin auf -e</b>: der Kunde, Kollege, Experte, Pädagoge → nur <b>-n</b></li>
<li><b>Andere</b>: der Nachbar → den Nachbar<span class="end">n</span></li>
</ul>
<h3>Achtung: KEINE n-Deklination</h3>
<p>der Direktor (des Direktor<b>s</b>), der Mechaniker, der Tierarzt, der Lehrer, der Bäcker, der Mitarbeiter, der Schauspieler, der Tänzer, der Passagier</p>
<h3>Wann ist es Dativ?</h3>
<ul>
<li>nach <b>mit, von, bei, zu, aus, nach, seit</b></li>
<li>nach <b>helfen, gehören, danken, vertrauen, zuhören, gefallen</b></li>
</ul>
<p><b>Trick:</b> Erst den Fall bestimmen, dann den Artikel (dem/den/des), dann die Endung.</p>
<p><b>Übung 8 und 9</b> (eigene Sätze, Kreativaufgabe) schreibst du auf Papier. Unterstreiche die n-Nomen!</p>
</div>
<div class="papa"><b>Para papá:</b> en las fichas ya hechas casi todo está bien. Los fallos son de dos tipos:
<br>1) <b>Pone <i>den</i> donde va <i>dem</i></b> (Dativ): <i>mit <b>dem</b> Experten</i>, <i>hilft <b>dem</b> Assistenten</i>, <i>vertraut <b>dem</b> Tierarzt</i>. Es el fallo que más se repite.
<br>2) <b>Se le escapa la -en en <i>Athlet</i> y <i>Pilot</i></b>: <i>den Athlet<b>en</b></i>, <i>des Pilot<b>en</b></i>.
<br>En Übung 5.1 parece que marcó <i>der</i> (va <i>den</i> Polizisten). Las Übungen 6 a 9 están en blanco: la 6 y la 7 las tiene aquí; la 8 y la 9 que las escriba a mano y te las corrijo. Los primeros ejercicios de esta pestaña, marcados en rosa, son sus fallos.</div>`;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RW=()=>{
  const mc=RWP.map(([r,b])=>{const others=shuffle(RWP.filter(p=>p[1]!==b).map(p=>p[1])).slice(0,2);const o=shuffle([b,...others]);return{q:"Was bedeutet „"+r+"“?",o,a:o.indexOf(b)}});
  return [...mc,...RWFIX];
};

const store={get(){try{return JSON.parse(localStorage.getItem('ka2de')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('ka2de',JSON.stringify(v))}catch(e){}}};
let best=store.get();

const TEST=()=>shuffle([...shuffle(LG).slice(0,5),...shuffle(LW).slice(0,4),...shuffle(RW()).slice(0,5),...shuffle(ND).slice(0,6)]);

const TABS=[
{id:'lg',name:'Lügengeschichte (S. 96)',th:theoryLG,ex:()=>LG},
{id:'lw',name:'Lügen-Wörter (S. 86)',th:theoryLW,ex:()=>LW},
{id:'rw',name:'Redewendungen',th:theoryRW,ex:RW},
{id:'nd',name:'n-Deklination',th:theoryND,ex:()=>ND},
{id:'test',name:'Probetest',th:`<h2>Probetest</h2><div class="theory"><p>20 gemischte Fragen aus allen vier Themen. Jedes Mal neu gemischt.</p></div>`,ex:TEST}
];

const tabsEl=document.getElementById('tabs'),main=document.getElementById('main');
const drawTabs=cur=>{tabsEl.innerHTML=TABS.map(t=>`<button role="tab" id="tab-${t.id}" aria-selected="${t.id===cur}" data-t="${t.id}">${esc(t.name)}${best[t.id]!=null?`<span class="sc">${best[t.id]}%</span>`:''}</button>`).join('')};

let state=null;
const render=id=>{
  const t=TABS.find(x=>x.id===id)||TABS[0];
  drawTabs(t.id);
  const items=t.ex();
  state={id:t.id,items,done:new Set(),right:0};
  main.innerHTML=t.th+(items.length?`<div class="bar"><div class="meter"><i id="m"></i></div><span id="cnt">0 / ${items.length} richtig</span><button class="go" id="again">Neu starten</button></div>`+items.map((x,i)=>`
  <div class="q" data-i="${i}"><span class="n">${i+1}</span>${x.f?'<span class="tag">Fehler aus dem Arbeitsblatt</span>':''}<p>${esc(x.q)}</p>${x.o?`<div class="opts">${x.o.map((o,j)=>`<button data-j="${j}">${esc(o)}</button>`).join('')}</div>`:`<form class="row"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort ${i+1}"><button class="go" type="submit">Prüfen</button></form>`}<div class="fb"></div></div>`).join(''):'');
  try{history.replaceState(null,'','#'+t.id)}catch(e){}
};

const mark=(qEl,i,ok)=>{
  const x=state.items[i],fb=qEl.querySelector('.fb');
  const sol=x.o?x.o[x.a]:x.t[0];
  fb.className='fb '+(ok?'ok':'bad');
  fb.textContent=ok?('Richtig! '+(x.w||'')):('Leider nicht. Richtig: '+sol+(x.w?' – '+x.w:''));
  if(!state.done.has(i)){state.done.add(i);if(ok)state.right++}
  const n=state.items.length;
  document.getElementById('m').style.width=(state.right/n*100)+'%';
  document.getElementById('cnt').textContent=state.right+' / '+n+' richtig';
  if(state.done.size===n){const p=Math.round(state.right/n*100);if(best[state.id]==null||p>best[state.id]){best[state.id]=p;store.set(best);drawTabs(state.id)}}
};

tabsEl.addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b){render(b.dataset.t);window.scrollTo({top:document.querySelector('.tabs').offsetTop})}});
main.addEventListener('click',e=>{
  if(e.target.id==='again'){render(state.id);return}
  const b=e.target.closest('.opts button');if(!b)return;
  const qEl=b.closest('.q'),i=+qEl.dataset.i,x=state.items[i],j=+b.dataset.j,ok=j===x.a;
  qEl.querySelectorAll('.opts button').forEach((btn,k)=>{btn.classList.remove('ok','bad');if(k===x.a)btn.classList.add('ok');else if(k===j)btn.classList.add('bad')});
  mark(qEl,i,ok);
});
main.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,qEl=f.closest('.q'),i=+qEl.dataset.i,x=state.items[i];
  const v=N(f.querySelector('input').value);if(!v)return;
  mark(qEl,i,x.t.some(a=>N(a)===v));
});
render((location.hash||'').slice(1)||'lg');
}
